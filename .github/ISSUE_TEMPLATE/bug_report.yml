name: Bug Report
description: Report a bug to help us improve
labels: [bug]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Arche are you running? (check /api/health or the release tag)
      placeholder: e.g. 1.2.3

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Copy and paste any relevant logs. This will be automatically formatted.
      render: shell
